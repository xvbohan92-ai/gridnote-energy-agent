[project]
name = "energy-analysis-agent"
version = "0.2.0"
description = "A local, evidence-backed energy data analysis agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "langgraph>=1.0,<2",
  "sqlglot>=26,<31",
  "openai>=2,<3",
  "python-dotenv>=1,<2",
]

[project.urls]
Repository = "https://github.com/xvbohan92-ai/gridnote-energy-agent"
Documentation = "https://github.com/xvbohan92-ai/gridnote-energy-agent#readme"
Issues = "https://github.com/xvbohan92-ai/gridnote-energy-agent/issues"

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.11,<1"]
viz = [
    "matplotlib>=3.9,<4",
]

[project.scripts]
energy-agent = "energy_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["energy_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
